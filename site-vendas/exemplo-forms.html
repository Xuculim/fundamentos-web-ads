<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Exemplo Formulário HTML</title>
</head>
<body>
    <header>
        <h1>Página de cadastro - Exemplo</h1>
    </header>
    <main>
        <section>
            <form id="registerForm" method="POST">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required />
                
                <br>

                <label for="email">Informe seu e-mail:</label>
                <input type="email" id="email" name="email" required/>

                <br>

                <label for="senha">Informe sua senha:</label>
                <input id="senha" name="senha" type="password" required minlength="8" maxlength="12"/>

                <br>

                <input type="text" id="cpf" name="cpf" placeholder="xxx.xxx.xxx-xx" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato esperado: 000.000.000-00"/>

                <br>

                <textarea id="mensagem" name="mensagem" rows="4" cols="30" placeholder="Digite o texto"></textarea>

                <br>

                <label for="evento">Escolha seu evento:</label>
                <select id="evento" name="evento">
                    <option value="Rock">Show Rock</option>
                    <option value="Sertanejo">Show Sertanejo</option>
                    <option value="Jogos">Jogo universitário</option>
                </select>
                
                <br>

                <label for="termos">
                    <input id="termos" name="termos" type="checkbox" required/> Concordo com os termos de uso.
                </label>

                <br>

                <label><input type="radio" value="pix" name="pagamento"/>Pix</label>
                <label><input type="radio" value="cartao" name="pagamento"/>Cartão</label>

                <br>

                <input type="number" step="5" />

                <br>

                <input type="submit" value="Cadastrar"/>
            </form>

        </section>
    </main>
    <footer>
        <p> &copy; Desenvolvido por Paulo Foroni </p>
    </footer>

    <script>
        //Pegando através do ID do formulário o evento de submissão (envio) do Forms.
        document.getElementById("registerForm") .addEventListener("submit", function(event){
            event.preventDefault(); //Este comando evita o recarregamento da página.
            const nome = document.getElementById("nome").value
            const cpf = document.getElementById('cpf').value
            const password = document.getElementById('senha').value
            alert("Olá" +nome+ " Formulário preenchido !")
            alert('Aqui estão seus dados: '+ cpf + " " + password)
        })
    </script>
</body>
</html>
